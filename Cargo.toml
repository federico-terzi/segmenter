[package]
name = "segmenter"
version = "0.1.4"
edition = "2021"
build = "build.rs"
license = "GPL-3.0"

[features]
default = ["engine-metal", "windows-default-onnx"]
engine-metal = []
engine-onnx = ["dep:half", "dep:ndarray", "dep:ort"]
windows-default-onnx = []

[dependencies]
anyhow = "1.0.86"
clap = { version = "4.4.18", features = ["derive"] }
image = "0.25.1"
log = { version = "0.4.21", features = ["std"] }
scopeguard = "1.2.0"

[target.'cfg(target_os = "macos")'.dependencies]
half = { version = "2.4.1", optional = true }
libc = "0.2.155"
ndarray = { version = "0.16", optional = true }
objc = "0.2.7"
ort = { version = "=2.0.0-rc.10", features = ["coreml", "half"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
half = "2.4.1"
ndarray = "0.16"
ort = { version = "=2.0.0-rc.10", features = ["directml", "half"] }
windows = { version = "0.58.0", features = [
  "Win32_Foundation",
  "Win32_Media",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
] }

[build-dependencies]
cc = "1.0.83"

[target.'cfg(target_os = "macos")'.build-dependencies]
bindgen = "0.69.4"
